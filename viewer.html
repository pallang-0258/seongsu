<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무표 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header">
  <div class="header-title">📋 근무표 뷰어</div>
  <div class="header-tabs">
    <button class="tab active" onclick="switchViewerTab('schedule')">근무표</button>
    <button class="tab" onclick="switchViewerTab('leave')">연차/반차</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="syncIndicator" style="font-size:11px;color:#2e7d32;min-width:70px;text-align:right"></span>
  </div>
</div>

<div class="mobile-tabbar">
  <button class="mobile-tab active" id="mtab-schedule" onclick="switchViewerTab('schedule')"><span class="mt-icon">📋</span>근무표</button>
  <button class="mobile-tab" id="mtab-leave" onclick="switchViewerTab('leave')"><span class="mt-icon">📅</span>연차/반차</button>
</div>

<div class="layout">
  <div class="main">
    <!-- 근무표 탭 -->
    <div id="tabSchedule">
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <select id="weekYearSel" onchange="onWeekSelChange()" style="height:32px;font-size:12px;width:76px"></select>
            <select id="weekMonthSel" onchange="onWeekSelChange()" style="height:32px;font-size:12px;width:60px"></select>
            <select id="weekPickSel" onchange="onWeekPick()" style="height:32px;font-size:13px;font-weight:600;width:200px"></select>
            <button class="btn sm" onclick="changeWeek(-1)" title="이전 주">◀</button>
            <button class="btn sm" onclick="changeWeek(1)" title="다음 주">▶</button>
            <button class="btn sm" onclick="goToThisWeek()" style="font-size:11px">이번 주</button>
            <div class="wk-badge" id="weekTypeBadge" style="background:#e8f5e9;color:#2e7d32">홀수 주</div>
            <div class="confirm-badge unconfirmed" id="confirmBadge">● 미확정</div>
          </div>
        </div>
        <div class="sch-wrap"><table class="sch-table" id="screenSchTable"></table></div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">요일별 근무 명단 요약</div>
        <div class="sum-wrap"><table class="sum-table" id="screenSummary"></table></div>
      </div>
    </div>

    <!-- 연차/반차 탭 -->
    <div id="tabLeave" style="display:none">
      <div class="card">
        <div class="card-header">
          <div class="card-title">연차 / 반차 신청 현황</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <select id="leaveTableYear" onchange="renderLeaveTable()" style="height:32px;font-size:12px;width:80px"></select>
            <select id="leaveTableMonth" onchange="renderLeaveTable()" style="height:32px;font-size:12px;width:70px">
              <option value="">전체</option>
              <option value="01">1월</option><option value="02">2월</option><option value="03">3월</option>
              <option value="04">4월</option><option value="05">5월</option><option value="06">6월</option>
              <option value="07">7월</option><option value="08">8월</option><option value="09">9월</option>
              <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
            </select>
          </div>
        </div>
        <div id="leaveTableWrap" style="overflow:visible"><table class="lv-table" id="leaveTable"></table></div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">연차/반차 달력</div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="btn sm" onclick="calChangeMonth(-1)">◀</button>
            <div style="font-weight:600;font-size:13px;min-width:90px;text-align:center" id="calMonthLabel"></div>
            <button class="btn sm" onclick="calChangeMonth(1)">▶</button>
          </div>
        </div>
        <div class="cal-emp-filter" id="calEmpFilter"></div>
        <div id="calGridWrap" style="overflow:visible"><div class="cal-grid" id="calGrid"></div></div>
        <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888"><div style="width:10px;height:10px;border-radius:2px;background:#fff8e1"></div>연차</div>
          <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888"><div style="width:10px;height:10px;border-radius:2px;background:#fce4ec"></div>반차(오전)</div>
          <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888"><div style="width:10px;height:10px;border-radius:2px;background:#ede7f6"></div>반차(오후)</div>
          <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888"><div style="width:10px;height:10px;border-radius:2px;background:#fff8f7;border:1px solid #f5c6c2"></div>공휴일</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">직원별 사용 내역</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <select id="leaveEmpFilter" onchange="onLeaveHistoryEmpChange()" style="height:32px;font-size:12px;width:150px"></select>
            <select id="leaveYearFilter" onchange="renderLeaveHistoryViewer()" style="height:32px;font-size:12px;width:90px"></select>
          </div>
        </div>
        <div style="font-size:11px;color:#90aac8;margin-bottom:10px">본인 확인을 위해 휴대폰 번호 뒷자리 4자리를 입력해야 확인할 수 있습니다.</div>
        <div id="leaveHistory"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/dateUtils.js"></script>
<script src="js/holidays.js"></script>
<script src="js/state.js"></script>
<script src="js/scheduleEngine.js"></script>
<script src="js/leaveEngine.js"></script>
<script src="js/viewerUi.js"></script>
<script src="js/viewerMain.js"></script>
</body>
</html>
